<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pink Code · Organizer</title><style>body{font-family:system-ui;background:#170c22;color:#fff;margin:0;padding:22px}main{max-width:850px;margin:auto}.card{background:#30203f;border:1px solid #75526e;border-radius:20px;padding:22px;margin:12px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #967f9e;background:#fcf5fb;color:#31132b;margin:5px 0 12px;font:inherit}textarea{min-height:65px}button{background:#f59dc4;color:#321328;border:0;padding:13px 20px;border-radius:12px;font-weight:750;cursor:pointer;margin:6px 6px 6px 0}.secondary{background:#594767;color:white}.danger{background:#ffe2df}small{color:#e6c6df}h1{color:#ffb7d7}#state{white-space:pre-wrap}</style></head><body><main><h1>🎀 THE PINK CODE · Organizer</h1><p>Private editing interface · لوحة تحرير المنظم</p><div class="card"><label>Organizer secret (provided by site owner)</label><input id="password" type="password" autocomplete="off" placeholder="Private secret"><button onclick="load()">Load current questions</button><button class="secondary" onclick="add()">+ Add question</button><button onclick="save()">Publish all changes</button><p id="state">Only the owner can configure the secret in Netlify. Do not share this page publicly.</p></div><div id="items"></div><p><a href="/" style="color:#ffbfd9">Return to game</a></p></main><script>
let config={questions:[]};const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let r=await fetch('/api?action=content');if(!r.ok)throw Error('Server not active');config=await r.json();render();$('state').textContent='Loaded '+config.questions.length+' questions.'}catch(e){$('state').textContent=e.message+' — use the deployed Netlify site, not a local HTML file.'}}
function render(){ $('items').innerHTML=config.questions.map((q,i)=>`<section class="card"><h2>Question ${i+1}</h2><button class="danger" onclick="removeQ(${i})">Delete question</button><label>English question</label><textarea data-i="${i}" data-field="en">${esc(q.en)}</textarea><label>السؤال بالعربية</label><textarea dir="rtl" data-i="${i}" data-field="ar">${esc(q.ar)}</textarea><div>${q.optionsEn.map((o,j)=>`<label>Answer ${j+1} (English)</label><input data-i="${i}" data-j="${j}" data-lang="optionsEn" value="${esc(o)}"><label>الإجابة ${j+1} (عربي)</label><input dir="rtl" data-i="${i}" data-j="${j}" data-lang="optionsAr" value="${esc(q.optionsAr[j])}">`).join('')}</div><label>Correct answer (1–${q.optionsEn.length})</label><select data-i="${i}" data-field="correct">${q.optionsEn.map((_,j)=>`<option value="${j}" ${j===q.correct?'selected':''}>${j+1}</option>`).join('')}</select><label>Medical explanation in English</label><textarea data-i="${i}" data-field="whyEn">${esc(q.whyEn)}</textarea><label>الشرح الطبي بالعربية</label><textarea dir="rtl" data-i="${i}" data-field="whyAr">${esc(q.whyAr)}</textarea><button class="secondary" onclick="extra(${i})">+ Add answer choice</button><button class="secondary" onclick="less(${i})">− Remove last choice</button></section>`).join('');}
function collect(){document.querySelectorAll('[data-field]').forEach(x=>{let q=config.questions[+x.dataset.i];q[x.dataset.field]=x.dataset.field==='correct'?+x.value:x.value});document.querySelectorAll('[data-lang]').forEach(x=>config.questions[+x.dataset.i][x.dataset.lang][+x.dataset.j]=x.value)}
function add(){collect();config.questions.push({en:'New question',ar:'سؤال جديد',optionsEn:['Option A','Option B'],optionsAr:['الخيار أ','الخيار ب'],correct:0,whyEn:'Add approved medical explanation.',whyAr:'أضف شرحاً طبياً معتمداً.'});render()}
function removeQ(i){collect();if(config.questions.length===1)return alert('Keep at least one question');if(confirm('Delete question?')){config.questions.splice(i,1);render()}}
function extra(i){collect();let q=config.questions[i];if(q.optionsEn.length>=5)return alert('Maximum 5 choices');q.optionsEn.push('New choice');q.optionsAr.push('خيار جديد');render()}
function less(i){collect();let q=config.questions[i];if(q.optionsEn.length<=2)return;q.optionsEn.pop();q.optionsAr.pop();q.correct=Math.min(q.correct,q.optionsEn.length-1);render()}
async function save(){collect();if(!confirm('Publish updated questions to all players?'))return;try{let r=await fetch('/api?action=content',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('password').value},body:JSON.stringify(config)});let d=await r.json();if(!r.ok)throw Error(d.error||'Error');$('state').textContent='✅ Published! New games will use the updated content.'}catch(e){$('state').textContent='❌ '+e.message}}
load();
</script></body></html>
